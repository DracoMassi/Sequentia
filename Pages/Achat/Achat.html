  <style>
    /* Section fiches */
    .fiches-section {
      margin-bottom: 20px;
      width: 70%; /* seulement 70% de l'écran */
      margin-left: auto;
      margin-right: auto;
    }
  
    /* Titre du dossier */
    .fiches-title {
      font-size: 28px;
      font-family: 'Montserrat', sans-serif;
      color: #a1adff;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      user-select: none;
    }
  
    /* Triangle indicateur */
    .triangle {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 12px solid #a1adff;
      margin-right: 10px;
      transition: transform 0.2s ease;
    }
  
    .triangle.open {
      transform: rotate(90deg); /* pointe vers le bas quand ouvert */
    }
  
    .fiches-list {
      display: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 10px;
    }
  
    .fiche {
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      transition: transform 0.2s ease, background 0.2s ease;
    }
  
    .fiche:hover { transform: scale(1.05); }
  
    .fiche a { color: white; text-decoration: none; font-weight: 600; }
  
    .fiche .meta { font-size: 13px; color: #aaa; margin-top: 6px; }
  
    /* Style quand dossier ouvert */
    .fiches-section.open .fiches-title {
      color: #fff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <div class="fixed-container">
      <a href="../../index.html"><div class="logo-bar" alt="Logo Sequentia" id="logo"></div></a>
      <div class="menu">
        <div style="display: none;font-size: 50px;">✕</div>

  <main>
    <h1 class="section-title">Achats</h1>
    <input id="search" placeholder="Cherche par matière ou titre">
    <div id="fiches"></div>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4803776883475277"
    crossorigin="anonymous"></script>
<!-- Pub -->
<ins class="adsbygoogle"
    style="display:block"
    data-ad-client="ca-pub-4803776883475277"
    data-ad-slot="2187779981"
    data-ad-format="auto"
    data-full-width-responsive="true"></ins>
<script>
    (adsbygoogle = window.adsbygoogle || []).push({});
</script>
    <script>
      const gvizUrl = `https://docs.google.com/spreadsheets/d/1CsFSb2h58PfLOUcPSrkIIG-hyyDuLtgqz4DPzzloX-M/gviz/tq?tqx=out:json&sheet=Fiches`;

      async function loadFiches(){
        const res = await fetch(gvizUrl);
        const text = await res.text();
        const json = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf(')')));
        const rows = json.table.rows.map(r => ({
          titre: r.c[0] ? r.c[0].v : '',
          matiere: r.c[1] ? r.c[1].v : '',
          lien: r.c[2] ? r.c[2].v : '',
          date: r.c[3] ? r.c[3].f : '',
          filename: r.c[4] ? r.c[4].v : '',
          fileId: r.c[5] ? r.c[5].v : ''
        })).reverse();
        window.FICHES = rows;
        renderGrouped(rows);
      }

      function renderGrouped(list){
        const container = document.getElementById('fiches');
        container.innerHTML = '';

        const groups = {};
        list.forEach(f => {
          const key = f.matiere || 'Autres';
          if(!groups[key]) groups[key] = [];
          groups[key].push(f);
        });

        Object.keys(groups).forEach(matiere => {
          const section = document.createElement('div');
          section.className = 'fiches-section';

          const title = document.createElement('div');
          title.className = 'fiches-title';
          title.textContent = matiere;

          const listDiv = document.createElement('div');
          listDiv.className = 'fiches-list';
          listDiv.innerHTML = groups[matiere].map(f => `
            <div class="fiche">
              <a href="${f.lien}" target="_blank">${f.titre}</a>
              <div class="meta">${f.date}</div>
            </div>
          `).join('');

          title.onclick = () => {
            listDiv.style.display = listDiv.style.display === 'grid' ? 'none' : 'grid';
          };

          section.appendChild(title);
          section.appendChild(listDiv);
          container.appendChild(section);
        });
      }

      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        const filtered = window.FICHES.filter(f => 
          (f.matiere||'').toLowerCase().includes(q) || 
          (f.titre||'').toLowerCase().includes(q)
        );
        renderGrouped(filtered);
      });

      loadFiches();
      function renderGrouped(list){
    const container = document.getElementById('fiches');
    container.innerHTML = '';
  
    const groups = {};
    list.forEach(f => {
      const key = f.matiere || 'Autres';
      if(!groups[key]) groups[key] = [];
      groups[key].push(f);
    });
  
    Object.keys(groups).forEach(matiere => {
      const section = document.createElement('div');
      section.className = 'fiches-section';
  
      const title = document.createElement('div');
      title.className = 'fiches-title';
  
      // Triangle indicateur
      const triangle = document.createElement('div');
      triangle.className = 'triangle';
      title.appendChild(triangle);
  
      const textNode = document.createTextNode(matiere);
      title.appendChild(textNode);
  
      const listDiv = document.createElement('div');
      listDiv.className = 'fiches-list';
      listDiv.innerHTML = groups[matiere].map(f => `
        <div class="fiche">
          <a href="${f.lien}" target="_blank">${f.titre}</a>
          <div class="meta">${f.date}</div>
        </div>
      `).join('');
  
      // Clic pour ouvrir/fermer le dossier
      title.onclick = () => {
        const isOpen = listDiv.style.display === 'grid';
        listDiv.style.display = isOpen ? 'none' : 'grid';
        triangle.classList.toggle('open', !isOpen);
        section.classList.toggle('open', !isOpen);
      };
  
      section.appendChild(title);
      section.appendChild(listDiv);
      container.appendChild(section);
    });
  }
    </script>
    
  </main>
</body>
